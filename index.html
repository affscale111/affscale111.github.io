<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VitalityScan | Metabolic Assessment</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            -webkit-tap-highlight-color: transparent;
            background-color: #FDFCFB;
        }
        .fade-in-up {
            animation: fadeInUp 0.5s ease-out forwards;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .btn-premium {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-premium:active {
            transform: scale(0.97);
        }
        .urgent-pulse {
            animation: pulse-red 2s infinite;
        }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
        .text-glow {
            text-shadow: 0 0 15px rgba(52, 211, 153, 0.3);
        }
    </style>
</head>
<body class="text-slate-900 antialiased overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const AFFILIATE_LINK = "https://hop.clickbank.net/?vendor=metabodrop&affiliate=scaled12&lid=1&tid=group1";
        
        const QUESTIONS = [
            { 
                id: 1, 
                text: "Primary Body Goal?", 
                sub: "Targets specific metabolic pathways",
                options: [
                    { label: "Lose Stubborn Fat", value: "stubborn", icon: "Target" },
                    { label: "Total Transformation", value: "total", icon: "Zap" },
                    { label: "Muscle Tone & Definition", value: "tone", icon: "Activity" },
                    { label: "Longevity & Health", value: "health", icon: "Heart" }
                ] 
            },
            { 
                id: 2, 
                text: "Metabolic Speed?", 
                sub: "Identifies your oxidation rate",
                options: [
                    { label: "Slow - Gain weight easily", value: "slow", icon: "Clock" },
                    { label: "Average - Consistent energy", value: "avg", icon: "Scale" },
                    { label: "Stalled - Used to be faster", value: "stalled", icon: "AlertCircle" }
                ] 
            },
            { 
                id: 3, 
                text: "Current Age Range?", 
                sub: "Adjusts for hormonal milestones",
                options: [
                    { label: "Under 35", value: "young", icon: "User" },
                    { label: "35 - 55", value: "mid", icon: "Users" },
                    { label: "Over 55", value: "mature", icon: "Shield" }
                ] 
            }
        ];

        const Icon = ({ name, size = 20, className = "" }) => {
            const icons = {
                Target: <path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20Zm0-2a8 8 0 1 1 0-16 8 8 0 0 1 0 16Zm0-4a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z" />,
                Zap: <path d="M13 2 3 14h9l-1 8 10-12h-9l1-8Z" />,
                Activity: <path d="M22 12h-4l-3 9L9 3l-3 9H2" />,
                Heart: <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" />,
                Clock: <React.Fragment><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></React.Fragment>,
                Scale: <path d="m3 21 3-3m15 3-3-3M5 13l2-2m12 2-2-2M12 3v18M9 6l3-3 3 3"/>,
                AlertCircle: <React.Fragment><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></React.Fragment>,
                CheckCircle: <React.Fragment><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></React.Fragment>,
                User: <React.Fragment><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></React.Fragment>,
                Users: <React.Fragment><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></React.Fragment>,
                Shield: <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z" />,
                ShieldCheck: <React.Fragment><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z" /><path d="m9 12 2 2 4-4" /></React.Fragment>,
                ArrowRight: <React.Fragment><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></React.Fragment>,
                ChevronRight: <polyline points="9 18 15 12 9 6"/>,
                Timer: <React.Fragment><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/><path d="M12 2v2"/></React.Fragment>,
                Star: <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
            };
            return (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name]}
                </svg>
            );
        };

        function App() {
            const [view, setView] = useState('intro');
            const [currentIdx, setCurrentIdx] = useState(0);
            const [answers, setAnswers] = useState([]);
            const [loadingStep, setLoadingStep] = useState(0);
            const [activeUsers, setActiveUsers] = useState(312);
            const [timeLeft, setTimeLeft] = useState(599); 

            useEffect(() => {
                if (view !== 'results') return;
                const timer = setInterval(() => {
                    setTimeLeft(prev => (prev > 0 ? prev - 1 : 0));
                }, 1000);
                return () => clearInterval(timer);
            }, [view]);

            useEffect(() => {
                const interval = setInterval(() => {
                    setActiveUsers(prev => prev + Math.floor(Math.random() * 3) - 1);
                }, 4000);
                return () => clearInterval(interval);
            }, []);

            const formatTime = (seconds) => {
                const m = Math.floor(seconds / 60);
                const s = seconds % 60;
                return `${m}:${s < 10 ? '0' : ''}${s}`;
            };

            const handleAnswer = (val) => {
                const newAnswers = [...answers, val];
                setAnswers(newAnswers);
                if (currentIdx < QUESTIONS.length - 1) {
                    setCurrentIdx(currentIdx + 1);
                } else {
                    runAnalysis();
                }
            };

            const runAnalysis = () => {
                setView('loading');
                let step = 0;
                const timer = setInterval(() => {
                    if (step < 3) {
                        setLoadingStep(step);
                        step++;
                    } else {
                        clearInterval(timer);
                        setView('results');
                    }
                }, 1000);
            };

            const archetype = useMemo(() => {
                if (answers.includes('slow') || answers.includes('stalled')) return "The Metabolic Resistor";
                return "The Latent Burner";
            }, [answers]);

            return (
                <div className="min-h-screen flex flex-col items-center">
                    
                    {}
                    <div className="w-full bg-emerald-900 text-white py-2 text-center text-[10px] font-black tracking-[0.2em] uppercase px-4 sticky top-0 z-[60]">
                        <span className="flex items-center justify-center gap-2">
                            <span className="w-1.5 h-1.5 bg-red-500 rounded-full animate-pulse"></span>
                            {activeUsers} Live Assessments in Progress
                        </span>
                    </div>

                    <nav className="w-full bg-white/95 backdrop-blur-md border-b border-slate-100 py-3 px-6 sticky top-[34px] z-50">
                        <div className="max-w-5xl mx-auto flex justify-between items-center">
                            <div className="font-black text-lg text-emerald-600 tracking-tighter flex items-center gap-1.5">
                                <Icon name="Activity" size={20} className="text-emerald-500" />
                                VITALITY<span className="text-slate-800">SCAN</span>
                            </div>
                            <div className="text-[8px] font-bold text-slate-400 uppercase tracking-widest bg-slate-50 px-3 py-1 rounded-full border border-slate-100">
                                Profile Confirmed
                            </div>
                        </div>
                    </nav>

                    <main className="flex-grow flex flex-col items-center justify-center w-full max-w-4xl px-5 py-6">
                        
                        {}
                        {view === 'intro' && (
                            <div className="w-full text-center space-y-8 fade-in-up py-4">
                                <div className="space-y-6 mx-auto flex flex-col items-center">
                                    <div className="inline-flex items-center gap-2 px-3 py-1 bg-emerald-50 text-emerald-700 rounded-full text-[9px] font-black uppercase tracking-widest border border-emerald-100">
                                        Clinical Bio-Audit
                                    </div>
                                    <h1 className="text-4xl md:text-7xl font-black text-slate-900 tracking-tight leading-[1.05] text-center w-full max-w-2xl">
                                        Why is your body <span className="text-emerald-600 italic">refusing</span> to lose fat?
                                    </h1>
                                    <p className="text-base md:text-xl text-slate-500 max-w-xl font-medium leading-relaxed text-center">
                                        Identify your unique <span className="text-slate-900 font-bold underline decoration-emerald-400 decoration-4 underline-offset-4">Metabolic Archetype</span> in 45 seconds.
                                    </p>
                                </div>
                                <div className="flex flex-col items-center gap-6">
                                    <button 
                                        onClick={() => setView('quiz')} 
                                        className="btn-premium w-full sm:w-80 bg-emerald-600 text-white px-10 py-5 rounded-2xl font-black text-lg shadow-xl shadow-emerald-100 flex items-center justify-center gap-3"
                                    >
                                        START ASSESSMENT <Icon name="ArrowRight" size={20} />
                                    </button>
                                    <div className="flex items-center justify-center gap-6">
                                        <p className="text-[9px] font-bold text-slate-400 uppercase tracking-widest flex items-center gap-1.5">
                                            <Icon name="ShieldCheck" size={14} className="text-emerald-500" /> Secure
                                        </p>
                                        <p className="text-[9px] font-bold text-slate-400 uppercase tracking-widest flex items-center gap-1.5">
                                            <Icon name="CheckCircle" size={14} className="text-emerald-500" /> 100% Free
                                        </p>
                                    </div>
                                </div>
                            </div>
                        )}

                        {}
                        {view === 'quiz' && (
                            <div className="max-w-xl w-full fade-in-up">
                                <div className="mb-8 px-2">
                                    <div className="flex justify-between items-end mb-2">
                                        <span className="text-[9px] font-black text-emerald-600 uppercase tracking-widest">Question {currentIdx + 1} of {QUESTIONS.length}</span>
                                        <span className="text-[9px] font-black text-slate-300 uppercase tracking-widest">{Math.round(((currentIdx + 1)/QUESTIONS.length)*100)}%</span>
                                    </div>
                                    <div className="w-full bg-slate-100 h-1.5 rounded-full overflow-hidden">
                                        <div className="bg-emerald-500 h-full transition-all duration-500" style={{width: `${((currentIdx + 1)/QUESTIONS.length)*100}%`}}></div>
                                    </div>
                                </div>

                                <div className="bg-white p-6 md:p-10 rounded-3xl shadow-xl border border-slate-50">
                                    <div className="text-center mb-8">
                                        <h2 className="text-2xl md:text-3xl font-black text-slate-900 mb-2 leading-tight tracking-tight">{QUESTIONS[currentIdx].text}</h2>
                                        <p className="text-[9px] font-bold text-slate-400 uppercase tracking-widest">{QUESTIONS[currentIdx].sub}</p>
                                    </div>
                                    <div className="grid gap-3">
                                        {QUESTIONS[currentIdx].options.map((opt, i) => (
                                            <button 
                                                key={i} 
                                                onClick={() => handleAnswer(opt.value)} 
                                                className="btn-premium w-full p-5 text-left rounded-2xl border-2 border-slate-50 hover:border-emerald-500 hover:bg-emerald-50/50 flex items-center justify-between group"
                                            >
                                                <div className="flex items-center gap-4">
                                                    <div className="w-10 h-10 bg-slate-50 rounded-xl flex items-center justify-center text-slate-400 group-hover:bg-emerald-500 group-hover:text-white transition-colors">
                                                        <Icon name={opt.icon} size={18} />
                                                    </div>
                                                    <span className="font-bold text-slate-700 group-hover:text-emerald-900">{opt.label}</span>
                                                </div>
                                                <Icon name="ChevronRight" size={16} className="text-slate-200" />
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {}
                        {view === 'loading' && (
                            <div className="text-center py-20 fade-in-up">
                                <div className="w-14 h-14 border-[5px] border-slate-100 border-t-emerald-600 rounded-full animate-spin mx-auto mb-8"></div>
                                <h2 className="text-2xl font-black text-slate-900 mb-2 tracking-tight">Processing Markers</h2>
                                <p className="text-emerald-600 font-bold uppercase tracking-[0.2em] text-[10px]">
                                    {["Analyzing Biological Data...", "Mapping Metabolic Loop...", "Compiling Final Profile..."][loadingStep]}
                                </p>
                            </div>
                        )}

                        {}
                        {view === 'results' && (
                            <div className="fade-in-up w-full space-y-10">
                                <div className="bg-white rounded-[2.5rem] overflow-hidden shadow-2xl border border-slate-100">
                                    <div className="bg-slate-900 p-8 md:p-12 text-center text-white relative overflow-hidden">
                                        <div className="absolute top-0 right-0 p-4 opacity-5">
                                            <Icon name="ShieldCheck" size={160} />
                                        </div>
                                        <div className="relative z-10 space-y-6">
                                            <div className="inline-flex items-center gap-2 px-3 py-1 bg-red-500/20 border border-red-500/30 rounded-full text-[9px] font-black tracking-[0.2em] uppercase text-red-400">
                                                Final Report: Verified Accuracy <Icon name="AlertCircle" size={12} />
                                            </div>
                                            <h2 className="text-3xl md:text-6xl font-black tracking-tight leading-none uppercase italic">Your Profile <br/><span className="text-emerald-400 not-italic">is Confirmed.</span></h2>
                                            <div className="pt-2 flex flex-col items-center">
                                                <p className="text-[9px] font-black text-white/40 uppercase tracking-[0.2em] mb-2">Detected Archetype:</p>
                                                <div className="bg-white text-slate-900 px-6 py-3 rounded-2xl font-black text-xl md:text-4xl shadow-xl transform -rotate-1">
                                                    {archetype}
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="p-6 md:p-12">
                                        <div className="grid lg:grid-cols-2 gap-12">
                                            <div className="space-y-6">
                                                <h3 className="text-2xl md:text-3xl font-black text-slate-900 leading-tight underline decoration-red-500 decoration-4">
                                                    CRITICAL FINDING:
                                                </h3>
                                                <p className="text-slate-500 text-sm md:text-lg leading-relaxed font-medium">
                                                    Based on your responses, you are currently in a <span className="text-slate-900 font-bold">"Storage Defensive Loop."</span> This is a physiological barrier where your body views caloric deficit as a threat, actively slowing down oxidation to protect fat stores.
                                                </p>
                                                <div className="p-4 bg-red-50 rounded-2xl border border-red-100 flex items-center gap-4">
                                                    <div className="w-10 h-10 bg-red-500 text-white rounded-full flex items-center justify-center shrink-0">
                                                        <Icon name="Timer" size={20} />
                                                    </div>
                                                    <div>
                                                        <p className="text-[10px] font-black text-red-600 uppercase tracking-widest">Security Warning</p>
                                                        <p className="text-sm font-bold text-slate-800 italic">This customized protocol link will deactivate soon.</p>
                                                    </div>
                                                </div>
                                            </div>

                                            <div className="bg-emerald-50 p-8 rounded-[2rem] border border-emerald-100 text-center flex flex-col justify-center urgent-pulse relative">
                                                <div className="absolute -top-3 left-1/2 -translate-x-1/2 bg-red-600 text-white text-[8px] font-black px-3 py-1 rounded-full uppercase tracking-widest">Limited Access</div>
                                                <div className="flex justify-center gap-1 mb-4">
                                                    <Icon name="Star" size={16} className="text-amber-400 fill-amber-400" />
                                                    <Icon name="Star" size={16} className="text-amber-400 fill-amber-400" />
                                                    <Icon name="Star" size={16} className="text-amber-400 fill-amber-400" />
                                                    <Icon name="Star" size={16} className="text-amber-400 fill-amber-400" />
                                                    <Icon name="Star" size={16} className="text-amber-400 fill-amber-400" />
                                                </div>
                                                <h4 className="font-black text-emerald-800 text-[10px] uppercase tracking-widest mb-2">Primary Recommendation</h4>
                                                <p className="text-slate-700 font-bold mb-6 text-sm">
                                                    Watch the specialized "Morning Switch" presentation to learn how to force your cells to resume fat oxidation.
                                                </p>
                                                <a href={AFFILIATE_LINK} target="_blank" className="btn-premium block w-full bg-emerald-600 text-white py-5 rounded-2xl font-black text-lg shadow-xl shadow-emerald-200 uppercase tracking-tight">
                                                    WATCH THE VIDEO NOW →
                                                </a>
                                                <div className="mt-4 flex flex-col items-center gap-1">
                                                    <div className="text-[12px] font-black text-red-600 tabular-nums">
                                                        OFFER EXPIRES IN: {formatTime(timeLeft)}
                                                    </div>
                                                    <p className="text-[8px] font-bold text-slate-400 uppercase tracking-widest">Tracking ID: VTS-992-URGENT</p>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                {}
                                <div className="space-y-8">
                                    <div className="text-center space-y-2">
                                        <h3 className="text-xs font-black text-slate-300 uppercase tracking-[0.3em]">Peer Verified</h3>
                                        <p className="text-2xl font-black text-slate-900 tracking-tight">Successful Profile Breakouts</p>
                                    </div>
                                    
                                    <div className="grid md:grid-cols-2 gap-6 pb-20">
                                        {[
                                            { name: "Sarah M.", text: "After years of plateauing, understanding my 'Resistor' profile changed everything. Down 22lbs in 7 weeks.", result: "-22 lbs", stars: 5, date: "2 days ago" },
                                            { name: "Jessica K.", text: "I was skeptical, but the science behind the loop is dead on. Finally broke my plateau.", result: "-14 lbs", stars: 5, date: "5 days ago" }
                                        ].map((rev, idx) => (
                                            <div key={idx} className="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm hover:shadow-md transition-shadow">
                                                <div className="flex justify-between items-start mb-4">
                                                    <div className="flex gap-0.5">
                                                        {[...Array(rev.stars)].map((_, i) => <Icon key={i} name="Star" size={14} className="text-amber-400 fill-amber-400" />)}
                                                    </div>
                                                    <span className="text-[10px] font-bold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-full uppercase tracking-tighter">{rev.result}</span>
                                                </div>
                                                <p className="text-slate-600 text-sm font-medium italic mb-4 leading-relaxed">"{rev.text}"</p>
                                                <div className="flex justify-between items-center border-t border-slate-50 pt-4">
                                                    <div className="flex items-center gap-2">
                                                        <div className="w-8 h-8 bg-emerald-50 rounded-full flex items-center justify-center font-black text-emerald-600 text-[10px]">
                                                            {rev.name[0]}
                                                        </div>
                                                        <p className="font-bold text-slate-900 text-xs">{rev.name}</p>
                                                    </div>
                                                    <span className="text-[9px] font-bold text-slate-300 uppercase">{rev.date}</span>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    <footer className="py-12 text-center px-6 opacity-30">
                        <p className="text-[8px] font-bold uppercase tracking-[0.2em] max-w-2xl mx-auto leading-relaxed">
                            © 2024 VITALITYSCAN. CLINICAL ASSESSMENT TOOL. WE MAY EARN COMMISSIONS ON PURCHASES. DATA SECURED. RESULTS VARY BY BIO-PROFILE.
                        </p>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
