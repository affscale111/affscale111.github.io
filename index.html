<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VitalityScan | Metabolic Assessment</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { background-color: #fcfbf7; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .rounded-4xl { border-radius: 2.5rem; }
        .shimmer-btn {
            position: relative; overflow: hidden;
            background: linear-gradient(90deg, #059669, #10b981, #059669);
            background-size: 200% auto; animation: shine 3s linear infinite;
        }
        @keyframes shine { to { background-position: 200% center; } }
        .critical-warning { background: #FFF5F5; border: 1px solid #FED7D7; color: #C53030; }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        const AFFILIATE_LINK = "https://your-weightloss-offer.com?hop=user";

        const QUESTIONS = [
            { id: 1, text: "What is your primary weight loss goal?", options: ["Lose stubborn fat", "Total body transformation", "Tone & Muscle"] },
            { id: 2, text: "Describe your metabolic speed:", options: ["Slow - I gain easily", "Average - Up and down", "Stalled recently"] },
            { id: 3, text: "How are your typical energy levels?", options: ["Low - Need caffeine", "Fluctuating - Afternoon crashes", "High energy"] },
            { id: 4, text: "How many hours of sleep do you get?", options: ["Less than 6 hours", "6 to 8 hours", "8+ hours"] },
            { id: 5, text: "Which best describes your eating habit?", options: ["Healthy but no weight loss", "Stress / Emotional eating", "Constant 'on and off' dieting"] },
            { id: 6, text: "What is your age range?", options: ["Under 35", "35 - 55", "Over 55"] }
        ];

        function App() {
            const [view, setView] = useState('intro');
            const [curr, setCurr] = useState(0);

            const next = () => {
                if (curr < QUESTIONS.length - 1) setCurr(curr + 1);
                else {
                    setView('loading');
                    setTimeout(() => setView('results'), 3000);
                }
            };

            if (view === 'intro') return (
                <div className="min-h-screen flex flex-col items-center justify-center p-6 text-center fade-in">
                    <header className="fixed top-0 w-full p-6 flex justify-between items-center bg-white/80 backdrop-blur-md border-b z-50">
                        <div className="font-black text-emerald-600 text-xl tracking-tighter italic">VITALITYSCAN</div>
                        <div className="flex gap-4 items-center">
                            <span className="text-[10px] font-bold text-slate-400">🛡️ SECURE</span>
                            <span className="text-[10px] font-bold text-slate-400">👤 8.4K DAILY</span>
                        </div>
                    </header>
                    <div className="bg-emerald-100 text-emerald-800 px-4 py-1 rounded-full text-[10px] font-black mb-6 uppercase tracking-widest mt-20">
                        ● 141 users currently taking the assessment
                    </div>
                    <h1 className="text-5xl md:text-7xl font-black text-slate-900 mb-8 leading-[1.1] uppercase italic">
                        Stop Guessing.<br/><span className="text-emerald-600">Start Burning.</span>
                    </h1>
                    <p className="text-slate-500 max-w-sm mb-10 font-medium">Identify your <strong>Body Type Archetype</strong> and unlock the protocol that matches your biology.</p>
                    <button onClick={() => setView('quiz')} className="bg-emerald-600 text-white text-xl font-black py-7 px-14 rounded-2xl shadow-[0_20px_50px_rgba(16,185,129,0.3)] hover:scale-105 transition-all">
                        FIND MY ARCHETYPE
                    </button>
                </div>
            );

            if (view === 'quiz') return (
                <div className="min-h-screen flex items-center justify-center p-4 fade-in">
                    <div className="w-full max-w-md bg-white p-10 rounded-4xl shadow-2xl">
                        <div className="w-full bg-slate-100 h-1.5 rounded-full mb-10 overflow-hidden">
                            <div className="bg-emerald-500 h-full transition-all duration-700" style={{width: `${((curr + 1) / QUESTIONS.length) * 100}%`}}></div>
                        </div>
                        <h2 className="text-2xl md:text-3xl font-black text-slate-800 mb-10 tracking-tight leading-tight">{QUESTIONS[curr].text}</h2>
                        <div className="space-y-4">
                            {QUESTIONS[curr].options.map((o, i) => (
                                <button key={i} onClick={next} className="w-full text-left p-6 rounded-2xl border-2 border-slate-50 hover:border-emerald-500 hover:bg-emerald-50 transition-all font-bold text-slate-700 text-lg">
                                    {o}
                                </button>
                            ))}
                        </div>
                    </div>
                </div>
            );

            if (view === 'loading') return (
                <div className="min-h-screen flex flex-col items-center justify-center text-center p-6">
                    <div className="w-20 h-20 border-4 border-emerald-500 border-t-transparent rounded-full animate-spin mb-8"></div>
                    <h2 className="text-3xl font-black italic uppercase tracking-tighter">Analyzing Biodata...</h2>
                    <p className="text-emerald-600 font-bold mt-2">Matching 1,400+ clinical studies...</p>
                </div>
            );

            return (
                <div className="min-h-screen bg-[#fcfbf7] p-4 py-12 fade-in">
                    <div className="max-w-2xl mx-auto bg-white rounded-4xl shadow-[0_60px_100px_-20px_rgba(0,0,0,0.1)] overflow-hidden">
                        <div className="bg-gradient-to-br from-emerald-500 to-emerald-700 p-16 text-center text-white">
                            <div className="w-16 h-16 bg-white/20 rounded-full flex items-center justify-center mx-auto mb-6 backdrop-blur-md">
                                <svg className="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 13l4 4L19 7"></path></svg>
                            </div>
                            <h2 className="text-5xl md:text-7xl font-black italic mb-6 leading-none">PROFILE READY</h2>
                            <p className="text-emerald-100 font-bold uppercase tracking-widest text-xs mb-4">Your Body Type Archetype</p>
                            <div className="bg-white text-emerald-800 px-10 py-3 rounded-full font-black text-xl inline-block shadow-lg">The Metabolic Resistor</div>
                        </div>
                        <div className="p-10 md:p-16">
                            <div className="critical-warning p-5 rounded-2xl text-[10px] font-black mb-10 flex items-center gap-3 uppercase tracking-wider">
                                <span className="w-6 h-6 bg-red-600 text-white rounded-full flex items-center justify-center text-sm">!</span>
                                Critical Metabolism Warning
                            </div>
                            <h3 className="text-4xl font-black mb-6 leading-[1.1] tracking-tight">Why your current efforts are being <span className="text-red-600 underline">blocked...</span></h3>
                            <p className="text-slate-500 text-lg mb-12 font-medium leading-relaxed">
                                Your data indicates your system is currently in a <strong>"Conservation Trap."</strong> Every calorie you cut causes your body to protect its fat stores even more aggressively.
                            </p>
                            
                            <div className="bg-slate-50 p-8 rounded-[2rem] border border-slate-100 mb-12 relative">
                                <p className="text-xs font-black text-slate-400 uppercase tracking-widest mb-4">The Solution</p>
                                <h4 className="text-2xl font-black text-slate-800 mb-8 leading-tight">To break this cycle, follow the <span className="text-emerald-600 italic">Vitality Reset Protocol.</span></h4>
                                <a href={AFFILIATE_LINK} target="_blank" className="shimmer-btn block text-center text-white text-2xl font-black py-10 rounded-[2rem] shadow-[0_20px_40px_rgba(16,185,129,0.4)] hover:scale-[1.02] transition-transform">
                                    WATCH THE PROTOCOL →
                                    <span className="block text-[10px] opacity-80 mt-1 font-bold">FREE PRESENTATION INCLUDED</span>
                                </a>
                            </div>
                            
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div className="p-8 bg-slate-50 rounded-[2rem] border border-slate-100">
                                    <div className="flex text-amber-400 mb-4 tracking-tighter text-xl font-black">★★★★★</div>
                                    <p className="text-sm font-bold text-slate-600 italic mb-6">"The metabolic analysis was the wake-up call I needed. The protocol actually works."</p>
                                    <div className="flex items-center gap-4">
                                        <div className="w-12 h-12 bg-emerald-500 rounded-2xl flex items-center justify-center text-white font-black text-xl">S</div>
                                        <div>
                                            <div className="font-black text-slate-800 leading-none">Sarah L.</div>
                                            <div className="text-[10px] font-black text-emerald-600">LOST 22LBS</div>
                                        </div>
                                    </div>
                                </div>
                                <div className="p-8 bg-slate-50 rounded-[2rem] border border-slate-100">
                                    <div className="flex text-amber-400 mb-4 tracking-tighter text-xl font-black">★★★★★</div>
                                    <p className="text-sm font-bold text-slate-600 italic mb-6">"I've tried everything. This is the first time I understood why my body was holding onto fat."</p>
                                    <div className="flex items-center gap-4">
                                        <div className="w-12 h-12 bg-emerald-500 rounded-2xl flex items-center justify-center text-white font-black text-xl">D</div>
                                        <div>
                                            <div className="font-black text-slate-800 leading-none">David K.</div>
                                            <div className="text-[10px] font-black text-emerald-600">LOST 45LBS</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
