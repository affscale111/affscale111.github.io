<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VitalityScan | Metabolic Assessment</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            -webkit-tap-highlight-color: transparent;
            background-color: #F8FAFC;
        }
        .fade-in { animation: fadeIn 0.6s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .pulse-subtle {
            animation: pulse-border 2s infinite;
        }
        @keyframes pulse-border {
            0% { border-color: rgba(16, 185, 129, 0.2); }
            50% { border-color: rgba(16, 185, 129, 0.6); }
            100% { border-color: rgba(16, 185, 129, 0.2); }
        }
        .step-transition { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="text-slate-900 antialiased overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const AFFILIATE_LINK = "https://hop.clickbank.net/?vendor=javaburn&affiliate=scaled12&lid=1&tid=group1";
        
        const QUESTIONS = [
            { id: 1, text: "Primary Body Goal?", sub: "Targets specific metabolic pathways", options: [{ label: "Lose Stubborn Fat", value: "stubborn", icon: "Target" }, { label: "Total Transformation", value: "total", icon: "Zap" }, { label: "Muscle Tone", value: "tone", icon: "Activity" }] },
            { id: 2, text: "Daily Energy Levels?", sub: "Identifies mitochondrial efficiency", options: [{ label: "Consistent & High", value: "high", icon: "Zap" }, { label: "Afternoon Crashes", value: "crash", icon: "AlertCircle" }, { label: "Waking Up Tired", value: "tired", icon: "Clock" }] },
            { id: 3, text: "Metabolic Speed?", sub: "Identifies your oxidation rate", options: [{ label: "Slow - Gain weight easily", value: "slow", icon: "Clock" }, { label: "Average - Consistent", value: "avg", icon: "Scale" }, { label: "Stalled - Plateaued", value: "stalled", icon: "AlertCircle" }] },
            { id: 4, text: "Reaction to Carbohydrates?", sub: "Determines insulin sensitivity archetype", options: [{ label: "Feel bloated or sleepy", value: "bloat", icon: "Activity" }, { label: "Intense sugar cravings", value: "crave", icon: "Flame" }, { label: "Energy boost / Stable", value: "stable", icon: "CheckCircle" }] },
            { id: 5, text: "Current Sleep Quality?", sub: "Measures hormonal recovery cycles", options: [{ label: "Restful (7-9 hours)", value: "good", icon: "ShieldCheck" }, { label: "Light / Interrupted", value: "light", icon: "Clock" }, { label: "Difficulty falling asleep", value: "bad", icon: "Timer" }] },
            { id: 6, text: "Hydration Habits?", sub: "Factors cellular metabolic transport", options: [{ label: "Drink water regularly", value: "good", icon: "Zap" }, { label: "Forget to drink water", value: "low", icon: "AlertCircle" }, { label: "Prefer coffee/soda", value: "caffeine", icon: "Timer" }] },
            { id: 7, text: "Evening Cravings?", sub: "Identifies late-night cortisol spikes", options: [{ label: "Rarely / Never", value: "none", icon: "CheckCircle" }, { label: "Occasional salty snacks", value: "salty", icon: "Activity" }, { label: "Frequent sweet cravings", value: "sweet", icon: "Flame" }] },
            { id: 8, text: "Current Age Range?", sub: "Adjusts for hormonal milestones", options: [{ label: "Under 35", value: "young", icon: "User" }, { label: "35 - 55", value: "mid", icon: "Users" }, { label: "Over 55", value: "mature", icon: "Shield" }] }
        ];

        const Icon = ({ name, size = 20, className = "" }) => {
            const icons = {
                Target: <path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20Zm0-2a8 8 0 1 1 0-16 8 8 0 0 1 0 16Zm0-4a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z" />,
                Zap: <path d="M13 2 3 14h9l-1 8 10-12h-9l1-8Z" />,
                Activity: <path d="M22 12h-4l-3 9L9 3l-3 9H2" />,
                Heart: <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" />,
                Clock: <React.Fragment><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></React.Fragment>,
                Scale: <path d="m3 21 3-3m15 3-3-3M5 13l2-2m12 2-2-2M12 3v18M9 6l3-3 3 3"/>,
                AlertCircle: <React.Fragment><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></React.Fragment>,
                CheckCircle: <React.Fragment><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></React.Fragment>,
                User: <React.Fragment><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></React.Fragment>,
                Users: <React.Fragment><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></React.Fragment>,
                Shield: <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z" />,
                ShieldCheck: <React.Fragment><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z" /><path d="m9 12 2 2 4-4" /></React.Fragment>,
                ArrowRight: <React.Fragment><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></React.Fragment>,
                ChevronRight: <polyline points="9 18 15 12 9 6"/>,
                Timer: <React.Fragment><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/><path d="M12 2v2"/></React.Fragment>,
                Star: <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />,
                Flame: <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z" />,
                ExternalLink: <React.Fragment><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></React.Fragment>
            };
            return (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name]}
                </svg>
            );
        };

        function App() {
            const [view, setView] = useState('intro');
            const [currentIdx, setCurrentIdx] = useState(0);
            const [answers, setAnswers] = useState([]);
            const [loadingStep, setLoadingStep] = useState(0);
            const [isCalculating, setIsCalculating] = useState(false);
            const [timeLeft, setTimeLeft] = useState(899);

            useEffect(() => {
                if (view !== 'results') return;
                const timer = setInterval(() => {
                    setTimeLeft(prev => (prev > 0 ? prev - 1 : 0));
                }, 1000);
                return () => clearInterval(timer);
            }, [view]);

            const formatTime = (seconds) => {
                const m = Math.floor(seconds / 60);
                const s = seconds % 60;
                return `${m}:${s < 10 ? '0' : ''}${s}`;
            };

            const handleAnswer = (val) => {
                const newAnswers = [...answers, val];
                setAnswers(newAnswers);
                
                // Micro-investment at midpoint (Question 4)
                if (currentIdx === 3) {
                    setIsCalculating(true);
                    setTimeout(() => {
                        setIsCalculating(false);
                        setCurrentIdx(currentIdx + 1);
                    }, 1400);
                } else if (currentIdx < QUESTIONS.length - 1) {
                    setCurrentIdx(currentIdx + 1);
                } else {
                    runAnalysis();
                }
            };

            const runAnalysis = () => {
                setView('loading');
                let step = 0;
                const timer = setInterval(() => {
                    if (step < 4) {
                        setLoadingStep(step);
                        step++;
                    } else {
                        clearInterval(timer);
                        setView('results');
                    }
                }, 1100);
            };

            const archetype = useMemo(() => {
                if (answers.includes('slow') || answers.includes('stalled') || answers.includes('crash')) return "The Metabolic Resistor";
                return "The Latent Burner";
            }, [answers]);

            return (
                <div className="min-h-screen flex flex-col items-center">
                    
                    <nav className="w-full bg-white border-b border-slate-100 py-4 px-6 sticky top-0 z-50 shadow-sm">
                        <div className="max-w-5xl mx-auto flex justify-between items-center">
                            <div className="font-black text-xl text-emerald-600 tracking-tighter flex items-center gap-2">
                                <Icon name="Activity" size={24} className="text-emerald-500" />
                                VITALITY<span className="text-slate-800">SCAN</span>
                            </div>
                            <div className="text-[10px] font-bold text-slate-400 uppercase tracking-widest bg-slate-50 px-3 py-1 rounded-full border border-slate-100">
                                2.4 Biological Analysis
                            </div>
                        </div>
                    </nav>

                    <main className="flex-grow flex flex-col items-center w-full max-w-4xl px-5 py-8 md:py-16">
                        
                        {}
                        {view === 'intro' && (
                            <div className="w-full text-center space-y-10 fade-in flex flex-col items-center">
                                <div className="space-y-6 max-w-2xl">
                                    <div className="inline-flex items-center gap-2 px-3 py-1 bg-emerald-50 text-emerald-700 rounded-full text-[10px] font-bold uppercase tracking-widest border border-emerald-100">
                                        Clinical Metabolic Audit
                                    </div>
                                    <h1 className="text-4xl md:text-7xl font-black text-slate-900 tracking-tight leading-[1.1]">
                                        Why is your body <span className="text-emerald-600">refusing</span> to lose fat?
                                    </h1>
                                    <p className="text-lg md:text-xl text-slate-500 font-medium leading-relaxed">
                                        Identify your unique <span className="text-slate-900 font-bold">Metabolic Archetype</span> and the physiological trigger keeping your fat cells locked.
                                    </p>
                                </div>
                                <div className="flex flex-col items-center gap-6 w-full max-w-sm">
                                    <button 
                                        onClick={() => setView('quiz')} 
                                        className="w-full bg-slate-900 text-white px-10 py-5 rounded-2xl font-bold text-lg shadow-xl shadow-slate-200 flex items-center justify-center gap-3 hover:bg-slate-800 active:scale-[0.98] transition-all"
                                    >
                                        START ASSESSMENT <Icon name="ArrowRight" size={20} />
                                    </button>
                                    <p className="text-[11px] font-medium text-slate-400 flex items-center gap-2 uppercase tracking-wide">
                                        <Icon name="ShieldCheck" size={14} className="text-emerald-500" /> Secure • Anonymous • 60 Seconds
                                    </p>
                                </div>
                            </div>
                        )}

                        {}
                        {view === 'quiz' && (
                            <div className="max-w-xl w-full fade-in">
                                <div className="mb-10 px-2">
                                    <div className="flex justify-between items-end mb-3">
                                        <span className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Assessment Progress</span>
                                        <span className="text-[10px] font-bold text-emerald-600 uppercase tracking-widest">{Math.round(((currentIdx + 1)/QUESTIONS.length)*100)}%</span>
                                    </div>
                                    <div className="w-full bg-slate-200 h-1.5 rounded-full overflow-hidden">
                                        <div className="bg-emerald-500 h-full transition-all duration-700" style={{width: `${((currentIdx + 1)/QUESTIONS.length)*100}%`}}></div>
                                    </div>
                                </div>

                                <div className="bg-white p-8 md:p-12 rounded-[2rem] shadow-xl border border-slate-100 min-h-[450px] flex flex-col justify-center">
                                    {isCalculating ? (
                                        <div className="text-center space-y-6 fade-in">
                                            <div className="w-12 h-12 border-4 border-emerald-100 border-t-emerald-600 rounded-full animate-spin mx-auto"></div>
                                            <div className="space-y-2">
                                                <p className="text-xs font-black text-emerald-600 uppercase tracking-widest">Mid-Point Sync</p>
                                                <p className="text-lg font-bold text-slate-900">Analyzing Biological Markers...</p>
                                            </div>
                                        </div>
                                    ) : (
                                        <React.Fragment>
                                            <div className="text-center mb-10">
                                                <h2 className="text-2xl md:text-3xl font-black text-slate-900 mb-3 tracking-tight">{QUESTIONS[currentIdx].text}</h2>
                                                <div className="inline-block px-3 py-1 bg-slate-50 rounded-full">
                                                    <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">{QUESTIONS[currentIdx].sub}</p>
                                                </div>
                                            </div>
                                            <div className="grid gap-3">
                                                {QUESTIONS[currentIdx].options.map((opt, i) => (
                                                    <button 
                                                        key={i} 
                                                        onClick={() => handleAnswer(opt.value)} 
                                                        className="w-full p-5 text-left rounded-xl border-2 border-slate-50 hover:border-emerald-500 hover:bg-emerald-50/30 flex items-center justify-between group bg-white transition-all active:scale-[0.98]"
                                                    >
                                                        <div className="flex items-center gap-4">
                                                            <div className="w-10 h-10 bg-slate-50 rounded-lg flex items-center justify-center text-slate-400 group-hover:bg-emerald-500 group-hover:text-white transition-all shadow-sm">
                                                                <Icon name={opt.icon} size={18} />
                                                            </div>
                                                            <span className="font-bold text-slate-700 group-hover:text-slate-900">{opt.label}</span>
                                                        </div>
                                                        <Icon name="ChevronRight" size={16} className="text-slate-200 group-hover:translate-x-1 transition-transform" />
                                                    </button>
                                                ))}
                                            </div>
                                        </React.Fragment>
                                    )}
                                </div>
                            </div>
                        )}

                        {}
                        {view === 'loading' && (
                            <div className="text-center py-20 fade-in flex flex-col items-center">
                                <div className="w-16 h-16 border-4 border-slate-100 border-t-emerald-600 rounded-full animate-spin mb-8"></div>
                                <h2 className="text-2xl font-black text-slate-900 mb-2 tracking-tight">Compiling Bio-Audit</h2>
                                <p className="text-emerald-600 font-bold uppercase tracking-[0.2em] text-[10px] h-4">
                                    {["Analyzing Markers...", "Mapping Metabolism...", "Cross-Referencing...", "Finalizing Protocol..."][loadingStep]}
                                </p>
                            </div>
                        )}

                        {}
                        {view === 'results' && (
                            <div className="fade-in w-full space-y-12">
                                <div className="bg-white rounded-[2.5rem] overflow-hidden shadow-2xl border border-slate-100">
                                    
                                    {/* Clinical Header */}
                                    <div className="bg-slate-900 p-10 md:p-16 text-center text-white relative">
                                        <div className="relative z-10 space-y-4">
                                            <div className="inline-flex items-center gap-2 px-3 py-1 bg-white/10 border border-white/20 rounded-full text-[10px] font-black tracking-widest uppercase text-emerald-400">
                                                Official Assessment Record <Icon name="ShieldCheck" size={12} />
                                            </div>
                                            <h2 className="text-4xl md:text-6xl font-black tracking-tight leading-none uppercase">Analysis <span className="text-emerald-400">Confirmed.</span></h2>
                                            <div className="pt-4 flex flex-col items-center">
                                                <p className="text-[10px] font-bold text-white/50 uppercase tracking-[0.2em] mb-3">Dominant Metabolic Archetype:</p>
                                                <div className="bg-white text-slate-900 px-8 py-4 rounded-xl font-black text-xl md:text-4xl shadow-2xl border-b-4 border-emerald-500">
                                                    {archetype}
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Data Section */}
                                    <div className="p-8 md:p-14">
                                        <div className="grid lg:grid-cols-2 gap-12 items-center">
                                            <div className="space-y-8">
                                                <div className="space-y-4">
                                                    <h3 className="text-2xl font-black text-slate-900 flex items-center gap-3">
                                                        <span className="w-8 h-[2px] bg-emerald-500"></span>
                                                        CLINICAL FINDING
                                                    </h3>
                                                    <p className="text-slate-600 text-lg leading-relaxed font-medium">
                                                        Your physiological markers indicate a <span className="text-slate-900 font-bold">"Defense Oxidation Barrier."</span> 
                                                    </p>
                                                    <p className="text-slate-500 text-sm leading-relaxed">
                                                        In this state, your mitochondria prioritize energy conservation over burning. Standard caloric restriction often exacerbates this, causing your core temperature to drop and weight to stall.
                                                    </p>
                                                </div>
                                                <div className="p-5 bg-slate-50 rounded-2xl border border-slate-200 flex items-center gap-5">
                                                    <div className="w-12 h-12 bg-slate-900 text-white rounded-full flex items-center justify-center shrink-0">
                                                        <Icon name="Activity" size={24} />
                                                    </div>
                                                    <div>
                                                        <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1">Response Recommendation</p>
                                                        <p className="text-sm font-bold text-slate-700 leading-snug">Requires an immediate metabolic reset signal to override the storage loop.</p>
                                                    </div>
                                                </div>
                                            </div>

                                            {/* Action Box */}
                                            <div className="bg-emerald-50 p-10 rounded-[2rem] border-2 border-emerald-100 text-center flex flex-col justify-center pulse-subtle relative">
                                                <div className="absolute -top-3 left-1/2 -translate-x-1/2 bg-emerald-600 text-white text-[9px] font-black px-4 py-1.5 rounded-full uppercase tracking-widest shadow-lg">Action Required</div>
                                                
                                                <h4 className="font-black text-slate-900 text-xl md:text-2xl mb-4 leading-tight">Watch the Metabolic Reset Presentation</h4>
                                                <p className="text-slate-600 font-medium mb-8 text-sm">
                                                    This evidence-based protocol is designed specifically to deactivate the storage trigger detected in your profile.
                                                </p>
                                                <a href={AFFILIATE_LINK} target="_blank" className="block w-full bg-emerald-600 text-white py-5 rounded-xl font-bold text-lg shadow-xl shadow-emerald-200 flex items-center justify-center gap-3 hover:bg-emerald-700 transition-all active:scale-[0.98]">
                                                    WATCH VIDEO NOW <Icon name="ExternalLink" size={18} />
                                                </a>
                                                <div className="mt-6 flex flex-col items-center gap-2">
                                                    <div className="text-[13px] font-black text-emerald-700 tabular-nums bg-white px-4 py-1.5 rounded-full border border-emerald-200 flex items-center gap-2">
                                                        <Icon name="Timer" size={14} className="text-emerald-600" />
                                                        OFFER EXPIRES: {formatTime(timeLeft)}
                                                    </div>
                                                    <p className="text-[8px] font-bold text-slate-400 uppercase tracking-widest mt-1 italic">Reference ID: VTS-{Math.floor(Math.random()*90000)+10000}</p>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                {}
                                <div className="space-y-10 pb-20">
                                    <div className="text-center space-y-2">
                                        <h3 className="text-[10px] font-black text-slate-300 uppercase tracking-[0.3em]">Verified Success</h3>
                                        <p className="text-2xl font-black text-slate-900 tracking-tight">Recent Profile Transformations</p>
                                    </div>
                                    
                                    <div className="grid md:grid-cols-2 gap-8 max-w-4xl mx-auto px-2">
                                        {[
                                            { name: "Sarah M.", text: "Breaking the 'Resistor' loop was the only thing that worked. Down 22lbs in 7 weeks.", result: "-22 lbs", stars: 5 },
                                            { name: "Jessica K.", text: "The science behind the storage loop is dead on. Finally broke my 2-year plateau.", result: "-14 lbs", stars: 5 }
                                        ].map((rev, idx) => (
                                            <div key={idx} className="bg-white p-8 rounded-3xl border border-slate-100 shadow-lg hover:shadow-xl transition-all">
                                                <div className="flex justify-between items-start mb-6">
                                                    <div className="flex gap-1">
                                                        {[...Array(rev.stars)].map((_, i) => <Icon key={i} name="Star" size={14} className="text-amber-400 fill-amber-400" />)}
                                                    </div>
                                                    <span className="text-[10px] font-black text-emerald-600 bg-emerald-50 px-3 py-1 rounded-full uppercase tracking-tighter">{rev.result}</span>
                                                </div>
                                                <p className="text-slate-500 text-base font-medium italic mb-6 leading-relaxed">"{rev.text}"</p>
                                                <div className="flex items-center gap-3">
                                                    <div className="w-10 h-10 bg-slate-900 text-white rounded-full flex items-center justify-center font-bold text-sm">
                                                        {rev.name[0]}
                                                    </div>
                                                    <div>
                                                        <p className="font-bold text-slate-900 text-xs">{rev.name}</p>
                                                        <p className="text-[9px] font-bold text-slate-400 uppercase tracking-widest">Verified User</p>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    <footer className="py-12 text-center px-6 border-t border-slate-100 w-full bg-white">
                        <div className="max-w-2xl mx-auto space-y-6 opacity-30 grayscale">
                            <p className="text-[9px] font-bold text-slate-400 uppercase tracking-[0.2em] leading-relaxed">
                                © 2024 VITALITYSCAN LABS. THIS IS A CLINICAL ASSESSMENT TOOL. RESULTS MAY VARY BASED ON INDIVIDUAL FACTORS. DATA SECURED VIA AES-256.
                            </p>
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
