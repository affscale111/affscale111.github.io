<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metabolic Audit | Weight Loss Quiz</title>
    <!-- Tailwind CSS for Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel for Logic -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background-color: #fcfbf7; }
        .shimmer {
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            background-size: 200% 100%;
            animation: shimmer 2s infinite;
        }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- CUSTOMIZE YOUR LINK HERE ---
        const AFFILIATE_LINK = "https://your-weightloss-offer.com?hop=user";

        const QUESTIONS = [
            { id: 1, text: "What is your primary weight loss goal?", options: [{ label: "Lose the last 10-15 stubborn pounds", value: "stubborn" }, { label: "A total body transformation (30+ lbs)", value: "total" }, { label: "Tone up and improve muscle definition", value: "tone" }, { label: "Improve health markers & energy levels", value: "health" }] },
            { id: 2, text: "Which best describes your current metabolic speed?", options: [{ label: "Slow - I gain weight just looking at food", value: "slow" }, { label: "Average - Weight goes up and down easily", value: "avg" }, { label: "Used to be fast, but has recently stalled", value: "stalled" }, { label: "Active metabolism", value: "active" }] },
            { id: 3, text: "How would you describe your typical energy levels?", options: [{ label: "Low - I need caffeine to get through the day", value: "low" }, { label: "Fluctuating - Afternoon crashes are common", value: "crash" }, { label: "Steady - But I struggle with evening cravings", value: "steady" }, { label: "High energy all day", value: "high" }] },
            { id: 4, text: "How many hours of sleep do you get on average?", options: [{ label: "Less than 6 hours (High stress/busy)", value: "poor" }, { label: "6 to 8 hours (Average/standard)", value: "normal" }, { label: "8+ hours (Restorative/deep)", value: "good" }] },
            { id: 5, text: "Which best describes your current eating habit?", options: [{ label: "I eat healthy but the scale doesn't move", value: "plateau" }, { label: "I struggle with emotional/stress eating", value: "emotional" }, { label: "I'm constantly 'on and off' different diets", value: "yo-yo" }] },
            { id: 6, text: "What is your age range?", options: [{ label: "Under 35", value: "young" }, { label: "35 to 55", value: "mid" }, { label: "Over 55", value: "mature" }] }
        ];

        function App() {
            const [view, setView] = useState('intro');
            const [currentQuestion, setCurrentQuestion] = useState(0);
            const [answers, setAnswers] = useState([]);
            const [loadingStep, setLoadingStep] = useState(0);
            const [activeUsers, setActiveUsers] = useState(142);

            useEffect(() => {
                const interval = setInterval(() => {
                    setActiveUsers(prev => prev + Math.floor(Math.random() * 3) - 1);
                }, 3000);
                return () => clearInterval(interval);
            }, []);

            const handleAnswer = (val) => {
                const newAnswers = [...answers, val];
                setAnswers(newAnswers);
                if (currentQuestion < QUESTIONS.length - 1) {
                    setCurrentQuestion(currentQuestion + 1);
                } else {
                    showLoading();
                }
            };

            const showLoading = () => {
                setView('loading');
                let step = 0;
                const interval = setInterval(() => {
                    step++;
                    setLoadingStep(step);
                    if (step >= 5) {
                        clearInterval(interval);
                        setView('results');
                    }
                }, 800);
            };

            const getArchetype = () => {
                if (answers.includes('slow') || answers.includes('plateau')) return "The Metabolic Resistor";
                if (answers.includes('low') || answers.includes('poor')) return "The Cortisol Burnout";
                return "The Latent Burner";
            };

            if (view === 'intro') return (
                <div className="min-h-screen flex flex-col items-center justify-center p-6 text-center">
                    <div className="bg-emerald-100 text-emerald-800 px-4 py-1 rounded-full text-sm font-bold mb-4">
                        🔥 {activeUsers} users currently taking the assessment
                    </div>
                    <h1 className="text-4xl md:text-6xl font-black text-slate-900 mb-6 leading-tight">
                        Stop Guessing.<br/><span className="text-emerald-600">Start Burning.</span>
                    </h1>
                    <p className="text-lg text-slate-600 max-w-md mb-8">
                        Take the 60-second metabolic audit to identify your <strong>Body Type Archetype</strong> and unlock the specific protocol that matches your biology.
                    </p>
                    <button 
                        onClick={() => setView('quiz')}
                        className="bg-emerald-600 text-white text-xl font-bold py-5 px-12 rounded-2xl shadow-xl hover:bg-emerald-700 transition-all transform hover:scale-105"
                    >
                        Find My Body Type
                    </button>
                </div>
            );

            if (view === 'quiz') return (
                <div className="min-h-screen flex flex-col items-center justify-center p-6">
                    <div className="w-full max-w-xl bg-white p-8 rounded-3xl shadow-2xl border border-emerald-50">
                        <div className="w-full bg-slate-100 h-2 rounded-full mb-8 overflow-hidden">
                            <div className="bg-emerald-500 h-full transition-all duration-500" style={{width: `${((currentQuestion + 1) / QUESTIONS.length) * 100}%`}}></div>
                        </div>
                        <h2 className="text-2xl font-bold text-slate-800 mb-8">{QUESTIONS[currentQuestion].text}</h2>
                        <div className="space-y-4">
                            {QUESTIONS[currentQuestion].options.map((opt, i) => (
                                <button 
                                    key={i}
                                    onClick={() => handleAnswer(opt.value)}
                                    className="w-full text-left p-5 rounded-2xl border-2 border-slate-100 hover:border-emerald-500 hover:bg-emerald-50 transition-all font-medium text-slate-700"
                                >
                                    {opt.label}
                                </button>
                            ))}
                        </div>
                    </div>
                </div>
            );

            if (view === 'loading') return (
                <div className="min-h-screen flex flex-col items-center justify-center p-6 text-center">
                    <div className="w-20 h-20 border-4 border-emerald-500 border-t-transparent rounded-full animate-spin mb-8"></div>
                    <h2 className="text-2xl font-bold text-slate-800 mb-2">Analyzing your markers...</h2>
                    <p className="text-emerald-600 font-medium">Step {loadingStep} of 5: Cross-referencing hormone data</p>
                </div>
            );

            return (
                <div className="min-h-screen flex flex-col items-center p-6 py-12">
                    <div className="w-full max-w-2xl bg-white rounded-[2.5rem] shadow-2xl overflow-hidden border border-emerald-50">
                        <div className="bg-emerald-600 p-8 text-center text-white">
                            <p className="uppercase tracking-widest text-sm font-bold opacity-80 mb-2">Your Results Are Ready</p>
                            <h2 className="text-3xl md:text-5xl font-black mb-4">Archetype Identified:</h2>
                            <div className="bg-white/20 backdrop-blur-md inline-block px-6 py-2 rounded-full text-xl font-bold">
                                {getArchetype()}
                            </div>
                        </div>
                        <div className="p-8 md:p-12 text-center">
                            <p className="text-lg text-slate-600 mb-8 leading-relaxed">
                                Based on your answers, your metabolism is currently in a <strong>protected state</strong>. Generic dieting will likely cause more harm than good. You need to follow the specific "Video Protocol" below to restart your fat-burning baseline.
                            </p>
                            
                            <a href={AFFILIATE_LINK} target="_blank" className="block w-full">
                                <button className="group relative w-full bg-emerald-600 text-white rounded-3xl py-8 px-6 shadow-[0_20px_40px_-15px_rgba(16,185,129,0.5)] transition-all hover:scale-[1.02] active:scale-[0.98]">
                                    <div className="absolute inset-0 rounded-3xl shimmer pointer-events-none"></div>
                                    <span className="block text-2xl font-black uppercase tracking-tight">Watch The Protocol Now</span>
                                    <span className="block text-emerald-100 text-sm font-medium mt-1">Free Presentation & Full Guide (Ends Today)</span>
                                </button>
                            </a>
                            
                            <div className="mt-8 flex items-center justify-center gap-2 text-slate-400 text-sm font-medium">
                                <span className="flex -space-x-2">
                                    {[1,2,3,4].map(i => <div key={i} className="w-6 h-6 rounded-full bg-slate-200 border-2 border-white"></div>)}
                                </span>
                                <span>8k+ people watched this today</span>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
